<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multisport live win probability</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main id="app" class="app" data-view="expanded">
    <header class="mast">
      <p class="brand">ELEVATION EDGE SPORTS DATA</p>
      <div class="title-line">
        <h1>MULTISPORT LIVE WIN PROBABILITY</h1>
        <p class="badge">V3</p>
        <div class="views" role="group" aria-label="View">
          <button type="button" class="view" data-view-choice="compact" aria-pressed="false">Compact</button>
          <button type="button" class="view" data-view-choice="expanded" aria-pressed="true">Expanded</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="levels">
          <div class="level">
            <p class="level-label" id="level-pro">Pro</p>
            <div class="sports" role="group" aria-labelledby="level-pro">
              <button type="button" class="sport is-selected" id="sport-nfl" aria-pressed="true">NFL</button>
              <button type="button" class="sport" id="sport-nhl" aria-pressed="false">NHL</button>
              <button type="button" class="sport" id="sport-nba" aria-pressed="false">NBA</button>
            </div>
          </div>
          <div class="level">
            <p class="level-label" id="level-college">College</p>
            <div class="sports" role="group" aria-labelledby="level-college">
              <button type="button" class="sport" id="sport-ncaaf" aria-pressed="false">NCAAF</button>
              <button type="button" class="sport" id="sport-ncaah" aria-pressed="false">NCAAH</button>
              <button type="button" class="sport" id="sport-ncaab" aria-pressed="false">NCAAB</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <article class="panel compact">
        <div class="ticker">
          <div class="ticker-field" aria-hidden="true">
            <span class="away-fill" id="c-away-bar"></span>
            <span class="home-fill" id="c-home-bar"></span>
          </div>
          <p class="ticker-copy">
            <span id="c-clock"></span>
            <span class="ticker-score">
              <img class="logo" id="c-away-logo" alt="" hidden>
              <span id="c-score"></span>
              <img class="logo" id="c-home-logo" alt="" hidden>
            </span>
            <span id="c-wp"></span>
          </p>
        </div>
      </article>

      <article class="panel expanded">
        <p class="expanded-clock" id="e-clock"></p>
        <div class="marks">
          <div class="mark away-mark">
            <p class="big"><span id="e-away-pct"></span><span class="unit">%</span></p>
            <p class="team-line">
              <img class="logo" id="e-away-logo" alt="" hidden>
              <span class="team" id="e-away-name"></span>
            </p>
            <p class="points" id="e-away-score"></p>
          </div>
          <div class="mark home-mark">
            <p class="big"><span id="e-home-pct"></span><span class="unit">%</span></p>
            <p class="team-line">
              <span class="team" id="e-home-name"></span>
              <img class="logo" id="e-home-logo" alt="" hidden>
            </p>
            <p class="points" id="e-home-score"></p>
          </div>
        </div>
      </article>
    </section>

    <section class="charts" id="charts">
      <figure class="chart-card">
        <svg id="score-chart" viewBox="0 0 640 200" role="img" aria-label="Score"></svg>
      </figure>
      <figure class="chart-card">
        <svg id="wp-chart" viewBox="0 0 640 200" role="img" aria-label="Win probability"></svg>
      </figure>
    </section>

    <section class="transport">
      <div class="transport-row">
        <button type="button" id="play">Play</button>
        <div class="steps" role="group" aria-label="Step">
          <button type="button" id="step-forward" aria-label="Step forward"><span class="tri tri-right" aria-hidden="true"></span></button>
          <button type="button" id="step-back" aria-label="Step back"><span class="tri tri-left" aria-hidden="true"></span></button>
        </div>
        <label class="scrub-label" for="scrub">Scrub</label>
        <input id="scrub" type="range" min="0" value="0" step="1">
      </div>
      <p id="position" class="position"></p>
    </section>

    <p class="prior" id="prior"></p>
    <footer>
      Unofficial project from Elevation Edge Sports Data. Not affiliated with the NFL, NHL, NBA, or NCAA.
    </footer>
  </main>
  <script src="nfl_nyg_den.js"></script>
  <script src="ncaaf_cu_ttu.js"></script>
  <script src="nhl_edm_col.js"></script>
  <script src="ncaah_den_mich.js"></script>
  <script src="nba_den_lal.js"></script>
  <script src="ncaab_cu_fla.js"></script>
  <script src="widget.js"></script>
</body>
</html>
